<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/mock/hero-main.svg" />
    <title>Lokalflöde Stockholm</title>
    <script>
      // A page of the app (the workspace panels and search mode) that was left in dark mode is painted dark from the first frame
      // instead of flashing white until the app has started (src/lib/theme.jsx takes over then and clearBootTheme() removes these
      // two properties). Keep the storage key and the paths in step with THEME_STORAGE_KEY and AppShell.
      (function () {
        try {
          if (!/^\/app(\/|$)/.test(location.pathname)) return;
          var stored = localStorage.getItem("office_rental_admin_theme");
          if (stored !== "dark" && !(stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) return;
          var root = document.documentElement;
          root.style.backgroundColor = "#050608";
          root.style.colorScheme = "dark";
          root.setAttribute("data-boot-theme", "dark");
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
